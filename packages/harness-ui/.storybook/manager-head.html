<style>
  /* Hide Color Scheme toolbar when harness-vscode theme is active */
  html[data-harness-theme="harness-vscode"] [aria-label^="Color Scheme"] {
    display: none !important;
  }

  /* Hide VS Code Theme toolbar by default and when harness theme is active */
  html:not([data-harness-theme="harness-vscode"]) [aria-label^="VSCode Theme"] {
    display: none !important;
  }
</style>
